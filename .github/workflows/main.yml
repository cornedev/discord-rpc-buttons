name: build discord-rpc

permissions:
  contents: write

on:
  push:
    branches: 
      - master
      - main
    paths:
      - .github/workflows/*
      - 'CMakeLists.txt'
      - '**/*.cpp'
      - '**/*.h'

concurrency:
  group: discord-rpc
  cancel-in-progress: true

jobs:
  build-linux:
    name: build discord-rpc (linux)
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \

      - name: configure cmake
        run: cmake -S . -B build

      - name: build project
        run: cmake --build build

  build-macos:
    name: build discord-rpc (macos)
    runs-on: macos-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install dependencies
        run: brew cmake

      - name: configure cmake
        run: |
          cmake -S . -B build

      - name: build project
        run: cmake --build build

  build-windows-mingw:
    name: build discord-rpc (windows)
    runs-on: windows-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake

      - name: build project windows
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles"
          cmake --build build
